:root{--navy:#123b70;--blue:#1769aa;--pale:#eef5fc;--ink:#172638;--muted:#64748b;--line:#dce5ef;--white:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:var(--ink);line-height:1.5}
header{background:linear-gradient(135deg,#123b70,#1976b9);color:white;padding:28px 16px 25px;text-align:center}
header h1{margin:0;font-size:30px;letter-spacing:.3px}
header p{margin:8px auto 0;max-width:700px;color:#e5f1ff}
main{max-width:1100px;margin:22px auto;padding:0 14px 40px}
.toolbar{background:white;border:1px solid var(--line);border-radius:15px;padding:15px;box-shadow:0 4px 16px #173b6410;position:sticky;top:0;z-index:5}
.controls{display:grid;grid-template-columns:1fr 230px;gap:10px}
input,select{width:100%;padding:13px;border:1px solid #cbd7e5;border-radius:9px;font-size:15px;background:white;color:var(--ink)}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
button{border:0;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:var(--navy);color:white}.secondary{background:#e8f1fb;color:var(--navy)}
button:active{transform:scale(.98)}
#status{font-size:13px;color:var(--muted);margin:10px 2px 0}
.category{margin-top:25px}
.category-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.category h2{font-size:20px;color:var(--navy);margin:0}
.count{font-size:12px;color:var(--muted);background:#e8eef6;padding:4px 9px;border-radius:20px;white-space:nowrap}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:white;border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 3px 12px #173b6409}
.card h3{font-size:16px;margin:0 0 8px;color:#193b62}
.card p{margin:5px 0;font-size:14px}
.card .label{font-weight:700;color:#42566d}
.card a{display:inline-block;margin-top:9px;color:#0868b5;font-weight:700;font-size:13px;overflow-wrap:anywhere}
.card-actions{display:flex;justify-content:flex-end;margin-top:8px}
.card-actions button{padding:7px 11px;font-size:12px}
.empty{background:white;border:1px dashed #b9c8d8;border-radius:12px;padding:25px;text-align:center;color:var(--muted)}
footer{text-align:center;padding:22px;color:var(--muted);font-size:12px}
@media(max-width:650px){header h1{font-size:25px}.controls{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.toolbar{position:static}}
</style>
</head>

const results = document.getElementById('results');
const search = document.getElementById('search');
const category = document.getElementById('category');
const status = document.getElementById('status');
const categories = [...new Set(schemes.map(s => s[0]))];
categories.forEach(c => {
  const option = document.createElement('option');
  option.value = c; option.textContent = c;
  category.appendChild(option);
});

function filteredSchemes(){
  const term = search.value.trim().toLowerCase();
  return schemes.filter(s => (category.value === 'all' || s[0] === category.value) &&
    (!term || s.join(' ').toLowerCase().includes(term)));
}
function formatScheme(s){
  return `${s[1]}\nCategory: ${s[0]}\nEligibility: ${s[2]}\nOfficial website: ${s[3]}`;
}

  const items = filteredSchemes();
